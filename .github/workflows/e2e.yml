name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  model:
    # Tekrarlanabilir eğitim + eval kapısı + Python Oracle (spec §13.4). Model yayınlandıktan sonra çalışır.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Model var mı?
        id: var
        run: |
          if [ -f model/config.json ]; then echo "var=1" >> "$GITHUB_OUTPUT"; else echo "::notice title=model::model/ henüz yok (gerçek veri bekleniyor); model işi atlandı"; fi
      - if: steps.var.outputs.var == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - if: steps.var.outputs.var == '1'
        run: pip install -r requirements.txt
      - if: steps.var.outputs.var == '1'
        name: Veri ve eğitim yeniden üretilir (aynı tohum, aynı sürümler)
        run: |
          python tools/sentetik_uret.py
          python tools/veri_hazirla.py
          python train.py
      - if: steps.var.outputs.var == '1'
        name: Tekrarlanabilirlik — repodaki artefaktla bayt bayt aynı mı?
        run: |
          git diff --stat --exit-code -- data/sentetik.csv data/oturumlar.csv model/ \
            || { echo "::error title=tekrarlanabilirlik::train.py başka bir artefakt üretti"; exit 1; }
          echo "::notice title=tekrarlanabilirlik::model/ ve veri bayt bayt aynı"
      - if: steps.var.outputs.var == '1'
        name: Python Oracle — parite.json şimdiki modelle tutarlı
        run: python tests/parite.py --kontrol
      - if: steps.var.outputs.var == '1'
        name: Hugging Face'teki commit'e sabit dosya = repodaki model.onnx
        run: |
          TABAN=$(grep -oE "https://huggingface.co/[^']+/resolve/[0-9a-f]{40}/" app/src/model.ts)
          echo "::notice title=model::$TABAN"
          python tests/parite.py --url "$TABAN" --kontrol

  cypress:
    needs: model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci --prefix app
      # Testlerde Gemini çağrıları cy.intercept ile taklit edilir; gerçek anahtar kullanılmaz.
      - run: npm --prefix app run build
        env:
          GEMINI_API_KEY: test-yer-tutucu
      - run: npm ci
      - name: Birim, özellik ve spec uyum testleri (Vitest)
        run: npx vitest run
      - name: Mutasyon testi (Stryker)
        run: npx stryker run 2>&1 | tail -15 | grep -E "All files|\.ts" | while read -r l; do echo "::notice title=mutasyon::$l"; done
      - name: Cypress doğrula
        run: npx cypress verify 2>&1 | tail -3 | while read -r l; do echo "::notice title=cypress verify::$l"; done
      - name: Cypress (tüm yollar + kabul örnekleri + demo)
        run: |
          npm run preview > preview.log 2>&1 &
          for i in $(seq 40); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4173 >/dev/null || { echo "::error title=preview::$(tail -8 preview.log | tr '\n' ' ')"; exit 1; }
          set +e
          npx cypress run --browser electron 2>&1 | tee cy.log
          code=${PIPESTATUS[0]}
          grep -E "Error|✖|failing|Socket" cy.log | head -15 | while read -r l; do echo "::warning title=cypress::$l"; done
          exit $code
      - name: Özet
        if: always()
        run: |
          {
            echo "## Cypress"
            ls cypress/videos 2>/dev/null | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          # Başarısız testleri annotation olarak yaz (loglar her yerden okunamıyor).
          python3 - <<'PY' || true
          import glob, xml.etree.ElementTree as ET
          n = f = 0
          for x in glob.glob('cypress/results/*.xml'):
              for tc in ET.parse(x).getroot().iter('testcase'):
                  n += 1
                  fl = tc.find('failure')
                  if fl is not None:
                      f += 1
                      msg = (fl.get('message') or fl.text or '')[:300].replace('\n', ' ')
                      print(f"::error title={tc.get('name')[:80]}::{msg}")
          print(f"::notice title=cypress::{n - f}/{n} test geçti")
          PY
          {
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videolar
          path: |
            cypress/videos
            cypress/screenshots
            cypress/results
          if-no-files-found: ignore
      - name: Videoları ci-videolar dalına yaz
        if: always() && github.event_name != 'pull_request'
        run: |
          set -e
          mkdir -p /tmp/v
          for d in videos screenshots results; do [ -d cypress/$d ] && cp -r cypress/$d /tmp/v/ || true; done
          [ -d tests/sonuc ] && cp -r tests/sonuc /tmp/v/birim || true
          [ -n "$(ls -A /tmp/v)" ] || exit 0
          cd /tmp/v
          git init -q -b ci-videolar
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Cypress videoları: ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-videolar
